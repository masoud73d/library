plugins {
    id 'com.android.application'
}

def stableSigningConfigured = [
    "ANDROID_KEYSTORE_PATH",
    "ANDROID_KEYSTORE_PASSWORD",
    "ANDROID_KEY_ALIAS",
    "ANDROID_KEY_PASSWORD"
].every { System.getenv(it)?.trim() }

android {
    namespace 'com.masoud.library'
    compileSdk 35

    defaultConfig {
        applicationId 'com.masoud.library'
        minSdk 23
        targetSdk 34
        versionCode (project.findProperty('appVersionCode') ?: '1').toInteger()
        versionName "1.0.${project.findProperty('appVersionCode') ?: '1'}"
    }

    signingConfigs {
        stable {
            if (stableSigningConfigured) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (stableSigningConfigured) {
                signingConfig signingConfigs.stable
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
