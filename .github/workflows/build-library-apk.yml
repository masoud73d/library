name: Build Library APK

on:
  push:
    branches:
      - main
      - offline-android
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare bundled web assets
        run: |
          ASSETS="android/app/src/main/assets/www"
          mkdir -p "$ASSETS/vendor"
          curl -fL "https://raw.githubusercontent.com/masoud73d/library/main/library-bg.png" -o "$ASSETS/library-bg.png"
          curl -fL "https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0/lib/qr-code-styling.js" -o "$ASSETS/vendor/qr-code-styling.js"
          curl -fL "https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js" -o "$ASSETS/vendor/zxing.min.js"
          curl -fL "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" -o "$ASSETS/vendor/tesseract.min.js"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check AndroidManifest XML
        run: |
          echo "Checking AndroidManifest.xml..."
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "rb") as f:
              data = f.read()
          print("File size:", len(data))
          print("First bytes:", repr(data[:100]))
          try:
              ET.fromstring(data)
              print("XML CHECK: PASSED")
          except ET.ParseError as e:
              print("XML CHECK: FAILED")
              print("Exact error:", e)
              raise
          PY
          echo "Manifest contents:"
          sed -n '1,120l' android/app/src/main/AndroidManifest.xml

      - name: Prepare persistent APK signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/library-signing.jks"
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/library-signing.jks" >> "$GITHUB_ENV"
            echo "Persistent signing key is fully configured."
          else
            echo "::warning::Persistent signing key is not fully configured. This APK will use a temporary debug key and must NOT be installed as the update version."
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug -PappVersionCode=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: library-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Remove signing key from runner
        if: always()
        run: rm -f android/app/library-signing.jks
