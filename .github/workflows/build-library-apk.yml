name: Build Library APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check AndroidManifest XML
        run: |
          echo "Checking AndroidManifest.xml..."
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "rb") as f:
              data = f.read()
          print("File size:", len(data))
          print("First bytes:", repr(data[:100]))
          try:
              ET.fromstring(data)
              print("XML CHECK: PASSED")
          except ET.ParseError as e:
              print("XML CHECK: FAILED")
              print("Exact error:", e)
              raise
          PY
          echo "Manifest contents:"
          sed -n '1,120l' android/app/src/main/AndroidManifest.xml

      - name: Validate WebView security boundaries
        run: |
          set -Eeuo pipefail
          JAVA="android/app/src/main/java/com/masoud/library/MainActivity.java"
          grep -q 'settings.setAllowFileAccess(false)' "$JAVA"
          grep -q 'setAcceptThirdPartyCookies(webView, false)' "$JAVA"
          grep -q 'private boolean isTrustedLocalOrigin(String rawUrl)' "$JAVA"
          grep -q 'private boolean isTrustedLocalPermissionOrigin(String rawOrigin)' "$JAVA"
          grep -q 'path.startsWith("/assets/offline/")' "$JAVA"
          grep -q 'boolean trustedAssetPath' "$JAVA"
          grep -q 'allow="clipboard-read; clipboard-write; fullscreen"' index.html
          grep -q 'corePath: "../../vendor/tesseract"' "$GITHUB_WORKSPACE/android/app/src/main/assets/offline/tools/Text-reader/index.html"
          grep -q 'if (!trustedLocalPageLoaded) return "{}";' "$JAVA"
          echo "WebView trust-boundary checks passed."

      - name: Prepare persistent APK signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/library-signing.jks"
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/library-signing.jks" >> "$GITHUB_ENV"
            echo "Persistent signing key is fully configured."
          else
            echo "::warning::Persistent signing key is not fully configured. This APK will use a temporary debug key and must NOT be installed as the update version."
          fi

      # Keep the same visual library and its calendar available from APK assets.
      - name: Prepare offline Android assets
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "::error::Offline asset preparation failed at line ${LINENO}: ${BASH_COMMAND} (exit ${status})"; exit "$status"' ERR
          ROOT="android/app/src/main/assets/offline"
          mkdir -p "$ROOT/tools" "$ROOT/vendor"
          cp index.html "$ROOT/index.html"
          cp library-bg.png "$ROOT/library-bg.png"
          cp update.json "$ROOT/update.json"
          declare -A TOOL_REFS=(
            [jadval-tanavobi]=d2929cecf15f7491422e09b0fbc6590b0d24b733
            [darooshenas]=b9cc0f03abd5a31cd758fb3718add3218d9a7041
            [taghvim]=8f5359aa38d686fe8051bc11be1dd2bec12ac331
            [etela-ate-system-]=45dcaf6881fdec08eb26838b41a7ba963a6daae7
            [azmayeshgah]=23fa13ef2cd4b6141b9cc7123c7eca3b71ba209f
            [ghoree-keshi]=12de1141e48c5e96247b8d8367895f7c852e4712
            [calculator]=362bdca3e0d76e9a43e043f1c5fda1a64ae45f54
            [Khodshenasi-va-taghvim]=4014ead178578e2799cf7ff9d274cdde7227ac81
            [adad-khan]=64f0c07717c2ffc761a0558277ec77c33507e9b6
            [Taas]=bfea7aa8faff4fcb10a992f18b2d61850f133884
            [Qr.Code]=a4628e6b3c9de415fbcd7ae28dbaf4769d9c390d
            [Colors]=d2b7e669e40115f4c10ea98ae59560512d8217b8
            [Text-reader]=260b42f8224f87097390c0a6e7677b3374bd17e7
            [dictionary]=9969c19a1e05758aca911c9ac2e3fe80e0506d8b
            [motarjeme-ramzi]=ed7d2a13cbfbb6322b5c2ec839367f8a46ca7360
            [weather]=3892070956b8d25292eb4145e622e6b8664432a5
            [Jaahaan-shenasi]=9e217091813ef401acb2d8d52dcb9e6bebba8f02
            [markaz-zaman]=8a8f1b09962966725d866b8655f87391d9e5a1ba
            [fasle-yab]=91012b64faf4e75b7b49f401ff3cbcdc23407120
          )
          declare -A TOOLS=(
            [jadval-tanavobi]=jadval-tanavobi
            [darooshenas]=darooshenas
            [taghvim]=taghvim
            [etela-ate-system-]=etela-ate-system-
            [azmayeshgah]=azmayeshgah
            [ghoree-keshi]=ghoree-keshi
            [calculator]=calculator
            [Khodshenasi-va-taghvim]=Khodshenasi-va-taghvim
            [adad-khan]=adad-khan
            [Taas]=Taas
            [Qr.Code]=Qr.Code
            [Colors]=Colors
            [Text-reader]=Text-reader
            [dictionary]=dictionary
            [motarjeme-ramzi]=motarjeme-ramzi
            [weather]=weather
            [Jaahaan-shenasi]=Jaahaan-shenasi
            [markaz-zaman]=markaz-zaman
            [fasle-yab]=fasle-yab
          )
          for slug in "${!TOOLS[@]}"; do
            mkdir -p "$ROOT/tools/$slug"
            ref="${TOOL_REFS[$slug]:-}"
            test -n "$ref" || { echo "::error::No pinned source revision for $slug"; exit 1; }
            if [[ "$slug" == "Qr.Code" || "$slug" == "Colors" || "$slug" == "Text-reader" ]]; then
              test -s "$ROOT/tools/$slug/index.html" || { echo "::error::Missing reviewed local tool: $slug"; exit 1; }
            else
              curl -fLsS "https://raw.githubusercontent.com/masoud73d/$slug/$ref/index.html" -o "$ROOT/tools/$slug/index.html"
            fi
          done
          for file in provinces.json cities.json counties.json county-centers.json; do
            curl -fLsS "https://raw.githubusercontent.com/masoud73d/fasle-yab/${TOOL_REFS[fasle-yab]}/$file" -o "$ROOT/tools/fasle-yab/$file"
          done
          # Vendor browser libraries so the core tools do not depend on a CDN at runtime.
          curl -fLsS https://cdn.tailwindcss.com/3.4.17 -o "$ROOT/vendor/tailwind.js"
          curl -fLsS https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o "$ROOT/vendor/three.min.js"
          curl -fLsS https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0/lib/qr-code-styling.js -o "$ROOT/vendor/qr-code-styling.js"
          curl -fLsS https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js -o "$ROOT/vendor/JsBarcode.all.min.js"
          curl -fLsS https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js -o "$ROOT/vendor/zxing.min.js"
          curl -fLsS https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js -o "$ROOT/vendor/tesseract.min.js"
          mkdir -p "$ROOT/vendor/tesseract" "$ROOT/vendor/tessdata"
          curl -fLsS https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js -o "$ROOT/vendor/tesseract/worker.min.js"
          # Tesseract 5 may select the SIMD+LSTM core at runtime; bundle every supported core variant.
          for core in tesseract-core tesseract-core-simd tesseract-core-lstm tesseract-core-simd-lstm; do
            curl -fLsS "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.0.0/${core}.wasm.js" -o "$ROOT/vendor/tesseract/${core}.wasm.js"
            curl -fLsS "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.0.0/${core}.wasm" -o "$ROOT/vendor/tesseract/${core}.wasm"
          done
          curl -fLsS https://tessdata.projectnaptha.com/4.0.0/fas.traineddata.gz -o "$ROOT/vendor/tessdata/fas.traineddata.gz"
          curl -fLsS https://tessdata.projectnaptha.com/4.0.0/eng.traineddata.gz -o "$ROOT/vendor/tessdata/eng.traineddata.gz"
          curl -fLsS https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css -o "$ROOT/vendor/all.min.css"
          sed -i 's#../webfonts/#webfonts/#g' "$ROOT/vendor/all.min.css"
          curl -fLsS https://raw.githubusercontent.com/bsthen/device-models/8067dfeb9f9bf3c36643470ba3addaf0b13021da/devices.json -o "$ROOT/tools/etela-ate-system-/devices.json"
          mkdir -p "$ROOT/vendor/webfonts"
          for font in fa-solid-900.woff2 fa-regular-400.woff2 fa-brands-400.woff2; do
            curl -fLsS "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/webfonts/$font" -o "$ROOT/vendor/webfonts/$font"
          done
          # Rewrite external library URLs to the bundled copies.
          sed -i 's#https://cdn.tailwindcss.com#../../vendor/tailwind.js#g' "$ROOT/tools/jadval-tanavobi/index.html" "$ROOT/tools/darooshenas/index.html" "$ROOT/tools/etela-ate-system-/index.html" "$ROOT/tools/azmayeshgah/index.html"
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#../../vendor/three.min.js#g' "$ROOT/tools/darooshenas/index.html"
          sed -i 's#https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0/lib/qr-code-styling.js#../../vendor/qr-code-styling.js#g; s#https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js#../../vendor/JsBarcode.all.min.js#g; s#https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js#../../vendor/zxing.min.js#g' "$ROOT/tools/Qr.Code/index.html"
          sed -i 's#https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js#../../vendor/tesseract.min.js#g' "$ROOT/tools/Text-reader/index.html"

          sed -i "s#https://cdn.jsdelivr.net/gh/bsthen/device-models/devices.json#./devices.json#g" "$ROOT/tools/etela-ate-system-/index.html"
          # Remove optional remote font imports; Android system fonts are used as fallback.
          sed -i '/fonts.googleapis.com/d; /fonts.gstatic.com/d; /Vazirmatn-font-face.css/d' "$ROOT/tools/"*/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path("android/app/src/main/assets/offline/tools").glob("*/index.html"):
              s = p.read_text(encoding="utf-8")
              s = re.sub(r"""https?://cdnjs\.cloudflare\.com/ajax/libs/font-awesome/[^"' ]+/css/all\.min\.css""", "../../vendor/all.min.css", s)
              s = s.replace("https://cdn.tailwindcss.com", "../../vendor/tailwind.js")
              p.write_text(s, encoding="utf-8")
          PY
          echo "Downloaded tool entry points:"
          find "$ROOT/tools" -mindepth 2 -maxdepth 2 -name index.html -print | sort
          for slug in "${!TOOLS[@]}"; do
            test -s "$ROOT/tools/$slug/index.html" || { echo "::error::Missing tool entry point: $slug"; exit 1; }
          done
          echo "All 19 tool entry points verified."
          test -s "$ROOT/tools/fasle-yab/cities.json"
          test -s "$ROOT/tools/taghvim/index.html"
          test -s "$ROOT/tools/etela-ate-system-/devices.json"
          test -s "$ROOT/vendor/tailwind.js"
          test -s "$ROOT/vendor/three.min.js"
          test -s "$ROOT/vendor/qr-code-styling.js"
          test -s "$ROOT/vendor/JsBarcode.all.min.js"
          test -s "$ROOT/vendor/zxing.min.js"
          test -s "$ROOT/vendor/tesseract.min.js"
          test -s "$ROOT/vendor/tesseract/worker.min.js"
          test -s "$ROOT/vendor/tessdata/fas.traineddata.gz"
          test -s "$ROOT/vendor/tessdata/eng.traineddata.gz"
          for core in tesseract-core tesseract-core-simd tesseract-core-lstm tesseract-core-simd-lstm; do
            test -s "$ROOT/vendor/tesseract/${core}.wasm.js"
            test -s "$ROOT/vendor/tesseract/${core}.wasm"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("android/app/src/main/assets/offline/tools")
          patterns = [
              re.compile(r"https?://cdnjs\.cloudflare\.com/ajax/libs/font-awesome/[^\s\"'<>]+/css/all\.min\.css"),
              re.compile(r"https?://cdnjs\.cloudflare\.com/ajax/libs/three\.js/r128/three\.min\.js"),
              re.compile(r"https?://cdn\.tailwindcss\.com"),
              re.compile(r"https?://cdn\.jsdelivr\.net/npm/(?:qr-code-styling|jsbarcode|tesseract\.js)"),
              re.compile(r"https?://unpkg\.com/@zxing"),
              re.compile(r"https?://fonts\.googleapis\.com"),
          ]
          found = []
          for path in root.glob("*/index.html"):
              content = path.read_text(encoding="utf-8")
              for number, line in enumerate(content.splitlines(), 1):
                  if any(pattern.search(line) for pattern in patterns):
                      found.append(f"{path}:{number}: {line.strip()[:240]}")
          if found:
              print("ERROR: unvendored external library references remain:")
              print("\n".join(found))
              raise SystemExit(1)
          else:
              print("Offline dependency validation: PASSED")
          print("Offline asset preparation completed; continuing to APK build.")
          PY

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug -PappVersionCode=${{ github.run_number }}

      - name: Verify OCR language data is packaged in APK
        run: |
          set -Eeuo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -F "assets/offline/vendor/tessdata/fas.traineddata.gz"
          unzip -l "$APK" | grep -F "assets/offline/vendor/tessdata/eng.traineddata.gz"
          echo "OCR Persian and English traineddata are present in the APK."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: library-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish approved APK release and update in-app updater
        if: contains(github.event.head_commit.message, '[publish-apk]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION}"
          APK_SOURCE="android/app/build/outputs/apk/debug/app-debug.apk"
          APK_NAME="library-${VERSION}.apk"
          cp "$APK_SOURCE" "$APK_NAME"

          gh release create "$TAG" "$APK_NAME#Library APK ${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Library ${VERSION}" \
            --notes "نسخه مستقل و امضاشده کتابخانه، آماده نصب و به‌روزرسانی."

          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
          UPDATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          JSON="$(jq -n --arg version "$VERSION" --arg url "$DOWNLOAD_URL" --arg date "$UPDATED_AT" '{version:$version,published:true,downloadUrl:$url,releaseNotes:"انتشار نسخه جدید کتابخانه؛ بهبودها و اصلاحات ابزارها.",updatedAt:$date}')"
          CONTENT="$(printf '%s' "$JSON" | base64 -w 0)"
          FILE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/update.json" --jq '.sha')"

          gh api "repos/${GITHUB_REPOSITORY}/contents/update.json" \
            --method PUT \
            -f message="Publish Library ${VERSION} in app updater [skip ci]" \
            -f content="$CONTENT" \
            -f sha="$FILE_SHA"

      - name: Remove signing key from runner
        if: always()
        run: rm -f android/app/library-signing.jks
