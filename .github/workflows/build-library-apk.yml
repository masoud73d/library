name: Build Library APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check AndroidManifest XML
        run: |
          echo "Checking AndroidManifest.xml..."
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "android/app/src/main/AndroidManifest.xml"

          with open(path, "rb") as f:
              data = f.read()

          print("File size:", len(data))
          print("First bytes:", repr(data[:100]))

          try:
              ET.fromstring(data)
              print("XML CHECK: PASSED")
          except ET.ParseError as e:
              print("XML CHECK: FAILED")
              print("Exact error:", e)
              raise
          PY

          echo "Manifest contents:"
          sed -n '1,120l' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon --stacktrace --info :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: library-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
