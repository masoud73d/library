name: Build Library APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check AndroidManifest XML
        run: |
          echo "Checking AndroidManifest.xml..."
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "rb") as f:
              data = f.read()
          print("File size:", len(data))
          print("First bytes:", repr(data[:100]))
          try:
              ET.fromstring(data)
              print("XML CHECK: PASSED")
          except ET.ParseError as e:
              print("XML CHECK: FAILED")
              print("Exact error:", e)
              raise
          PY
          echo "Manifest contents:"
          sed -n '1,120l' android/app/src/main/AndroidManifest.xml

      - name: Prepare persistent APK signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/library-signing.jks"
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/library-signing.jks" >> "$GITHUB_ENV"
            echo "Persistent signing key is fully configured."
          else
            echo "::warning::Persistent signing key is not fully configured. This APK will use a temporary debug key and must NOT be installed as the update version."
          fi

      # Keep the same visual library and its calendar available from APK assets.
      - name: Prepare offline Android assets
        run: |
          set -e
          ROOT="android/app/src/main/assets/offline"
          mkdir -p "$ROOT/tools" "$ROOT/vendor"
          cp index.html "$ROOT/index.html"
          cp library-bg.png "$ROOT/library-bg.png"
          cp update.json "$ROOT/update.json"
          declare -A TOOLS=(
            [jadval-tanavobi]=jadval-tanavobi
            [darooshenas]=darooshenas
            [taghvim]=taghvim
            [etela-ate-system-]=etela-ate-system-
            [azmayeshgah]=azmayeshgah
            [ghoree-keshi]=ghoree-keshi
            [calculator]=calculator
            [Khodshenasi-va-taghvim]=Khodshenasi-va-taghvim
            [adad-khan]=adad-khan
            [Taas]=Taas
            [Qr.Code]=Qr.Code
            [Colors]=Colors
            [Text-reader]=Text-reader
            [dictionary]=dictionary
            [motarjeme-ramzi]=motarjeme-ramzi
            [weather]=weather
            [Jaahaan-shenasi]=Jaahaan-shenasi
            [markaz-zaman]=markaz-zaman
            [fasle-yab]=fasle-yab
          )
          for slug in "${!TOOLS[@]}"; do
            mkdir -p "$ROOT/tools/$slug"
            curl -fLsS "https://raw.githubusercontent.com/masoud73d/$slug/HEAD/index.html" -o "$ROOT/tools/$slug/index.html"
          done
          for file in provinces.json cities.json counties.json county-centers.json; do
            curl -fLsS "https://raw.githubusercontent.com/masoud73d/fasle-yab/HEAD/$file" -o "$ROOT/tools/fasle-yab/$file"
          done
          # Vendor browser libraries so the core tools do not depend on a CDN at runtime.
          curl -fLsS https://cdn.tailwindcss.com -o "$ROOT/vendor/tailwind.js"
          curl -fLsS https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o "$ROOT/vendor/three.min.js"
          curl -fLsS https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0/lib/qr-code-styling.js -o "$ROOT/vendor/qr-code-styling.js"
          curl -fLsS https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js -o "$ROOT/vendor/JsBarcode.all.min.js"
          curl -fLsS https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js -o "$ROOT/vendor/zxing.min.js"
          curl -fLsS https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js -o "$ROOT/vendor/tesseract.min.js"
          curl -fLsS https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css -o "$ROOT/vendor/all.min.css"
          sed -i 's#../webfonts/#webfonts/#g' "$ROOT/vendor/all.min.css"
          curl -fLsS https://cdn.jsdelivr.net/gh/bsthen/device-models/devices.json -o "$ROOT/tools/etela-ate-system-/devices.json"
          mkdir -p "$ROOT/vendor/webfonts"
          for font in fa-solid-900.woff2 fa-regular-400.woff2 fa-brands-400.woff2; do
            curl -fLsS "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/webfonts/$font" -o "$ROOT/vendor/webfonts/$font"
          done
          # Rewrite external library URLs to the bundled copies.
          sed -i 's#https://cdn.tailwindcss.com#../../vendor/tailwind.js#g' "$ROOT/tools/jadval-tanavobi/index.html" "$ROOT/tools/darooshenas/index.html" "$ROOT/tools/etela-ate-system-/index.html" "$ROOT/tools/azmayeshgah/index.html"
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#../../vendor/three.min.js#g' "$ROOT/tools/darooshenas/index.html"
          sed -i 's#https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0/lib/qr-code-styling.js#../../vendor/qr-code-styling.js#g; s#https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js#../../vendor/JsBarcode.all.min.js#g; s#https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js#../../vendor/zxing.min.js#g' "$ROOT/tools/Qr.Code/index.html"
          sed -i 's#https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js#../../vendor/tesseract.min.js#g' "$ROOT/tools/Text-reader/index.html"
          sed -i "s#https://cdn.jsdelivr.net/gh/bsthen/device-models/devices.json#./devices.json#g" "$ROOT/tools/etela-ate-system-/index.html"
          # Remove optional remote font imports; Android system fonts are used as fallback.
          sed -i '/fonts.googleapis.com/d; /fonts.gstatic.com/d; /Vazirmatn-font-face.css/d' "$ROOT/tools/"*/index.html
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css#../../vendor/all.min.css#g; s#https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css#../../vendor/all.min.css#g' "$ROOT/tools/"*/index.html
          test "$(find "$ROOT/tools" -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 19
          test -s "$ROOT/tools/fasle-yab/cities.json"
          test -s "$ROOT/tools/taghvim/index.html"

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug -PappVersionCode=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: library-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish approved APK release and update in-app updater
        if: contains(github.event.head_commit.message, '[publish-apk]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION}"
          APK_SOURCE="android/app/build/outputs/apk/debug/app-debug.apk"
          APK_NAME="library-${VERSION}.apk"
          cp "$APK_SOURCE" "$APK_NAME"

          gh release create "$TAG" "$APK_NAME#Library APK ${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Library ${VERSION}" \
            --notes "نسخه مستقل و امضاشده کتابخانه، آماده نصب و به‌روزرسانی."

          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
          UPDATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          JSON="$(jq -n --arg version "$VERSION" --arg url "$DOWNLOAD_URL" --arg date "$UPDATED_AT" '{version:$version,published:true,downloadUrl:$url,releaseNotes:"انتشار نسخه جدید کتابخانه؛ بهبودها و اصلاحات ابزارها.",updatedAt:$date}')"
          CONTENT="$(printf '%s' "$JSON" | base64 -w 0)"
          FILE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/update.json" --jq '.sha')"

          gh api "repos/${GITHUB_REPOSITORY}/contents/update.json" \
            --method PUT \
            -f message="Publish Library ${VERSION} in app updater [skip ci]" \
            -f content="$CONTENT" \
            -f sha="$FILE_SHA"

      - name: Remove signing key from runner
        if: always()
        run: rm -f android/app/library-signing.jks
