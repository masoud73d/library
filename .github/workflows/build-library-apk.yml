name: Build Library APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check AndroidManifest XML
        run: |
          echo "Checking AndroidManifest.xml..."
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "rb") as f:
              data = f.read()
          print("File size:", len(data))
          print("First bytes:", repr(data[:100]))
          try:
              ET.fromstring(data)
              print("XML CHECK: PASSED")
          except ET.ParseError as e:
              print("XML CHECK: FAILED")
              print("Exact error:", e)
              raise
          PY
          echo "Manifest contents:"
          sed -n '1,120l' android/app/src/main/AndroidManifest.xml

      - name: Prepare persistent APK signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/library-signing.jks"
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/library-signing.jks" >> "$GITHUB_ENV"
            echo "Persistent signing key is fully configured."
          else
            echo "::warning::Persistent signing key is not fully configured. This APK will use a temporary debug key and must NOT be installed as the update version."
          fi

      - name: Prepare offline Android assets
        run: |
          mkdir -p android/app/src/main/assets/offline
          cp index.html android/app/src/main/assets/offline/index.html
          cp library-bg.png android/app/src/main/assets/offline/library-bg.png
          test -s android/app/src/main/assets/offline/index.html
          test -s android/app/src/main/assets/offline/library-bg.png
          test -s android/app/src/main/assets/offline/taghvim/index.html

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug -PappVersionCode=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: library-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish approved APK release and update in-app updater
        if: contains(github.event.head_commit.message, '[publish-apk]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION}"
          APK_SOURCE="android/app/build/outputs/apk/debug/app-debug.apk"
          APK_NAME="library-${VERSION}.apk"
          cp "$APK_SOURCE" "$APK_NAME"

          gh release create "$TAG" "$APK_NAME#Library APK ${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Library ${VERSION}" \
            --notes "نسخه مستقل و امضاشده کتابخانه، آماده نصب و به‌روزرسانی."

          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
          UPDATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          JSON="$(jq -n --arg version "$VERSION" --arg url "$DOWNLOAD_URL" --arg date "$UPDATED_AT" '{version:$version,published:true,downloadUrl:$url,releaseNotes:"انتشار نسخه جدید کتابخانه؛ بهبودها و اصلاحات ابزارها.",updatedAt:$date}')"
          CONTENT="$(printf '%s' "$JSON" | base64 -w 0)"
          FILE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/update.json" --jq '.sha')"

          gh api "repos/${GITHUB_REPOSITORY}/contents/update.json" \
            --method PUT \
            -f message="Publish Library ${VERSION} in app updater [skip ci]" \
            -f content="$CONTENT" \
            -f sha="$FILE_SHA"

      - name: Remove signing key from runner
        if: always()
        run: rm -f android/app/library-signing.jks
